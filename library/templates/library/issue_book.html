<!DOCTYPE html>
<html>
<head>
    <title>Issue Book</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            color: #243b55;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            box-sizing: border-box;
        }

        button {
            background: #243b55;
            color: white;
            padding: 12px 20px;
            border: none;
            margin-top: 25px;
            cursor: pointer;
            border-radius: 5px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #243b55;
        }

        .message {
            color: #c0392b;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Issue a Book</h1>
    <p>Assign a book to a registered student.</p>

    {% if messages %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Select Student</label>
        <select name="student" required>
            <option value="">-- Select Student --</option>

            {% for student in students %}
                <option value="{{ student.id }}">
                    {{ student.student_id }} - {{ student.user.first_name }}
                </option>
            {% endfor %}
        </select>

        <label>Select Book</label>
        <select name="book" required>
            <option value="">-- Select Book --</option>

            {% for book in books %}
                <option value="{{ book.id }}">
                    {{ book.title }} ({{ book.available_copies }} available)
                </option>
            {% endfor %}
        </select>

        <label>Issue Date</label>
        <input type="date" name="issue_date" required>

        <label>Due Date</label>
        <input type="date" name="due_date" required>

        <button type="submit">Issue Book</button>
    </form>

    <a href="{% url 'book_list' %}">← Back to Book List</a>

</div>

</body>
</html>
