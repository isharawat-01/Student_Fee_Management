<!DOCTYPE html>
<html>
<head>
    <title>Library Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #243b55;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #555;
            font-size: 16px;
        }

        .card p {
            font-size: 32px;
            font-weight: bold;
            color: #243b55;
        }

        .actions {
            margin-top: 35px;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .actions a {
            display: inline-block;
            background: #243b55;
            color: white;
            padding: 12px 18px;
            margin: 8px;
            text-decoration: none;
            border-radius: 5px;
        }

        @media(max-width: 750px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Library Management Dashboard</h1>
    <p>Overview of your college library.</p>

    <div class="cards">

        <div class="card">
            <h3>Total Book Copies</h3>
            <p>{{ total_books }}</p>
        </div>

        <div class="card">
            <h3>Available Books</h3>
            <p>{{ available_books }}</p>
        </div>

        <div class="card">
            <h3>Currently Issued</h3>
            <p>{{ issued_books_count }}</p>
        </div>

        <div class="card">
            <h3>Overdue Books</h3>
            <p>{{ overdue_books }}</p>
        </div>

    </div>

    <div class="actions">

        <h2>Library Operations</h2>

        <a href="{% url 'book_list' %}">View All Books</a>

        <a href="{% url 'issue_book' %}">Issue a Book</a>

        <a href="{% url 'issued_books' %}">Issued Books</a>

        <a href="/admin/">Admin Panel</a>

    </div>

</div>

</body>
</html>
