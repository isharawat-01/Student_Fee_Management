
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }
        .register-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }
        .brand { color: #2563eb; font-weight: 700; }
    </style>
</head>
<body>

<div class="register-card">
    <h3 class="brand text-center">Student Fee Portal</h3>
    <h5 class="text-center mt-3">Create Your Account</h5>
    <p class="text-center text-muted">Register to access your student dashboard</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" name="phone" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Select Course</label>
            <select name="course" class="form-select" required>
                <option value="">Choose Course</option>
                {% for course in courses %}
                    <option value="{{ course.id }}">
                        {{ course.course_name }} - ₹{{ course.total_fees }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control"
                   minlength="8" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Register Now
        </button>
    </form>

    <p class="text-center mt-3 mb-0">
        Already registered?
        <a href="{% url 'student_login' %}">Login here</a>
    </p>
</div>

</body>
</html>
