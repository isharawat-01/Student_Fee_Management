<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}College Management System{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #3157d5;
            --sidebar: #17233f;
            --background: #f5f7fc;
            --text: #26334d;
            --muted: #7b879c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        .sidebar {
            width: 255px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding: 25px 16px;
            background: var(--sidebar);
            color: white;
            overflow-y: auto;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            padding: 5px 12px 28px;
        }

        .sidebar-heading {
            color: #8290aa;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            padding: 12px 13px 8px;
            text-transform: uppercase;
        }

        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #c5cee0;
            text-decoration: none;
            padding: 12px 14px;
            margin-bottom: 5px;
            border-radius: 10px;
            font-size: 14px;
        }

        .sidebar nav a:hover,
        .sidebar nav a.active {
            background: #304b79;
            color: white;
        }

        .sidebar nav a i {
            font-size: 17px;
            width: 22px;
        }

        .main-content {
            margin-left: 255px;
            padding: 25px 30px;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            padding: 17px 23px;
            border-radius: 14px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            box-shadow: 0 3px 18px rgba(25, 42, 75, .05);
        }

        .topbar-title {
            font-weight: 700;
            font-size: 17px;
        }

        .welcome-user {
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width: 991px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                padding: 15px;
            }

            .brand {
                padding: 5px 8px 15px;
            }

            .sidebar-heading {
                display: none;
            }

            .sidebar nav {
                display: flex;
                overflow-x: auto;
                gap: 5px;
            }

            .sidebar nav a {
                flex: 0 0 auto;
            }

            .main-content {
                margin-left: 0;
                padding: 18px;
            }
        }

        @media (max-width: 576px) {
            .main-content {
                padding: 12px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <aside class="sidebar">

        <div class="brand">
            <i class="bi bi-mortarboard-fill me-2"></i>
            College Management
        </div>

        <div class="sidebar-heading">Main Menu</div>

        <nav>

            <a href="/dashboard/" class="active">
                <i class="bi bi-grid-1x2-fill"></i>
                Dashboard
            </a>

            <a href="/ai/">
                <i class="bi bi-robot"></i>
                AI Assistant
            </a>

            <a href="/library/">
                <i class="bi bi-book-half"></i>
                Library
            </a>

            <a href="/courses/">
                <i class="bi bi-mortarboard"></i>
                Courses
            </a>

            <a href="/subjects/">
                <i class="bi bi-journal-bookmark"></i>
                Subjects
            </a>

            <a href="/admin/">
                <i class="bi bi-gear-fill"></i>
                Administration
            </a>

        </nav>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <div class="topbar-title">
                <i class="bi bi-grid-1x2-fill text-primary me-2"></i>
                Student Management System
            </div>

            <div class="welcome-user">
                <i class="bi bi-person-circle me-1"></i>
                Welcome,
                <strong class="text-dark">{{ request.user.username }}</strong>
            </div>

        </header>

        <section class="content-area">
            {% block content %}{% endblock %}
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
