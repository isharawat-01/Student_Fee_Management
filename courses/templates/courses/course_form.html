{% extends "dashboard/base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">

    <div class="mb-4">
        <h2 class="fw-bold">{{ page_title }}</h2>
        <p class="text-muted">Enter course details below.</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Course Name *</label>
                    <input type="text"
                           name="course_name"
                           class="form-control"
                           value="{{ course.course_name|default:'' }}"
                           placeholder="Enter course name"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Course Code *</label>
                    <input type="text"
                           name="course_code"
                           class="form-control"
                           value="{{ course.course_code|default:'' }}"
                           placeholder="Enter course code"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Duration *</label>
                    <input type="text"
                           name="duration"
                           class="form-control"
                           value="{{ course.duration|default:'' }}"
                           placeholder="Example: 2 Years"
                           required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Description</label>
                    <textarea name="description"
                              class="form-control"
                              rows="4"
                              placeholder="Enter course description">{{ course.description|default:'' }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Save Course
                </button>

                <a href="{% url 'course_list' %}"
                   class="btn btn-secondary ms-2">
                    Cancel
                </a>
            </form>

        </div>
    </div>
</div>
{% endblock %}
